<!doctype html>
<html lang="%lang%">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="theme-color" content="#222222" />

	<!-- Favicon: logotipo oficial -->
	<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/brand/favicon-32.png" />
	<link rel="icon" type="image/png" sizes="192x192" href="%sveltekit.assets%/brand/favicon-192.png" />
	<link rel="apple-touch-icon" href="%sveltekit.assets%/brand/apple-touch-icon.png" />

	<!-- Google Fonts: Rajdhani (Display) + Chakra Petch (Accent) + Montserrat (Body) -->
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
	<link
		href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Chakra+Petch:wght@500;600;700&family=Montserrat:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
		rel="stylesheet"
	/>

	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>

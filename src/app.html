<!doctype html>
<html lang="es">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />

	<!-- SEO Base -->
	<meta name="description" content="Velocity Bucks #39347 — Equipo FTC. Ingeniería en movimiento." />
	<meta name="theme-color" content="#222222" />

	<!-- Open Graph -->
	<meta property="og:type" content="website" />
	<meta property="og:site_name" content="Velocity Bucks #39347" />
	<meta property="og:image" content="%sveltekit.assets%/og-image.png" />

	<!-- Favicon -->
	<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />

	<!-- Google Fonts: Rajdhani (Display) + Chakra Petch (Accent) + Montserrat (Body) -->
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
	<link
		href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
		rel="stylesheet"
	/>

	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
